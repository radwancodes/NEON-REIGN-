<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN REIGN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #050509;
      font-family: Arial, sans-serif;
      color: white;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #title {
      position: absolute;
      top: 25px;
      left: 30px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 15px #00eaff;
    }

    #mission {
      position: absolute;
      top: 75px;
      left: 30px;
      color: #b8c7d9;
      font-size: 14px;
    }

    #health {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 220px;
      height: 14px;
      border: 1px solid #ffffff66;
      background: #111;
    }

    #healthBar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00eaff, #008cff);
      box-shadow: 0 0 12px #00eaff;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: #fff;
      box-shadow: 0 0 8px #00eaff;
    }

    #crosshair::before {
      width: 18px;
      height: 2px;
      top: 8px;
    }

    #crosshair::after {
      width: 2px;
      height: 18px;
      left: 8px;
    }

    #controls {
      position: absolute;
      right: 25px;
      bottom: 25px;
      color: #aaa;
      font-size: 12px;
      text-align: right;
      line-height: 1.7;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050509;
      z-index: 10;
      font-size: 25px;
      letter-spacing: 6px;
      transition: opacity 1s;
    }
  </style>
</head>

<body>

<div id="loading">URBAN REIGN</div>

<div id="game"></div>

<div id="hud">
  <div id="title">URBAN REIGN</div>
  <div id="mission">MISSION 01 — ENTER THE CITY</div>

  <div id="crosshair"></div>

  <div id="health">
    <div id="healthBar"></div>
  </div>

  <div id="controls">
    W A S D — MOVE<br>
    MOUSE — LOOK<br>
    SHIFT — RUN
  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


// ================================
// SCENE
// ================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050509);

scene.fog = new THREE.FogExp2(
  0x070914,
  0.012
);


// ================================
// CAMERA
// ================================

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

camera.position.set(0, 2, 10);


// ================================
// RENDERER
// ================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


// ================================
// LIGHTING
// ================================

const ambient = new THREE.HemisphereLight(
  0x8aaaff,
  0x080808,
  1.4
);

scene.add(ambient);


const moon = new THREE.DirectionalLight(
  0x8bbcff,
  2
);

moon.position.set(
  50,
  100,
  20
);

moon.castShadow = true;

scene.add(moon);


// ================================
// GROUND
// ================================

const groundGeometry =
  new THREE.PlaneGeometry(
    1000,
    1000
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x080a0f,
    roughness: 0.28,
    metalness: 0.65
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);


// ================================
// CITY
// ================================

function createBuilding(x, z) {

  const width =
    8 + Math.random() * 18;

  const depth =
    8 + Math.random() * 18;

  const height =
    15 + Math.random() * 90;

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: new THREE.Color(
        0.015,
        0.02,
        0.035
      ),
      roughness: 0.4,
      metalness: 0.8
    });

  const building =
    new THREE.Mesh(
      geometry,
      material
    );

  building.position.set(
    x,
    height / 2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  scene.add(building);


  // Neon roof light

  const neonGeometry =
    new THREE.BoxGeometry(
      width * 0.8,
      0.15,
      0.2
    );

  const neonMaterial =
    new THREE.MeshBasicMaterial({
      color:
        Math.random() > 0.5
          ? 0x00eaff
          : 0xff006e
    });

  const neon =
    new THREE.Mesh(
      neonGeometry,
      neonMaterial
    );

  neon.position.set(
    x,
    height + 0.2,
    z
  );

  scene.add(neon);


  // Windows

  for (
    let y = 8;
    y < height - 4;
    y += 7
  ) {

    for (
      let wx = -width / 2 + 2;
      wx < width / 2 - 1;
      wx += 3
    ) {

      const windowGeometry =
        new THREE.BoxGeometry(
          1.1,
          1.8,
          0.08
        );

      const windowMaterial =
        new THREE.MeshBasicMaterial({
          color:
            Math.random() > 0.25
              ? 0x16d9ff
              : 0xff267f
        });

      const window =
        new THREE.Mesh(
          windowGeometry,
          windowMaterial
        );

      window.position.set(
        x + wx,
        y,
        z - depth / 2 - 0.05
      );

      scene.add(window);
    }
  }
}


// Create city blocks

for (let x = -250; x <= 250; x += 35) {

  for (let z = -250; z <= 250; z += 35) {

    // Keep central street open

    if (
      Math.abs(x) < 25 &&
      Math.abs(z) < 25
    ) continue;

    createBuilding(
      x + (Math.random() - 0.5) * 12,
      z + (Math.random() - 0.5) * 12
    );
  }
}


// ================================
// STREET LIGHTS
// ================================

function streetLight(x, z) {

  const poleGeometry =
    new THREE.CylinderGeometry(
      0.08,
      0.12,
      6
    );

  const poleMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x22252c,
      metalness: 0.9
    });

  const pole =
    new THREE.Mesh(
      poleGeometry,
      poleMaterial
    );

  pole.position.set(
    x,
    3,
    z
  );

  scene.add(pole);


  const lampGeometry =
    new THREE.SphereGeometry(
      0.25,
      12,
      12
    );

  const lampMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x00eaff
    });

  const lamp =
    new THREE.Mesh(
      lampGeometry,
      lampMaterial
    );

  lamp.position.set(
    x,
    6,
    z
  );

  scene.add(lamp);


  const light =
    new THREE.PointLight(
      0x00d9ff,
      4,
      18
    );

  light.position.set(
    x,
    6,
    z
  );

  scene.add(light);
}


for (
  let z = -220;
  z <= 220;
  z += 25
) {
  streetLight(12, z);
  streetLight(-12, z);
}


// ================================
// PLAYER
// ================================

const player = {
  speed: 0.12,
  runSpeed: 0.24
};

const controls =
  new PointerLockControls(
    camera,
    document.body
  );

document.body.addEventListener(
  "click",
  () => {
    controls.lock();
  }
);

scene.add(controls.object);


// ================================
// MOVEMENT
// ================================

const keys = {};

window.addEventListener(
  "keydown",
  e => {
    keys[e.code] = true;
  }
);

window.addEventListener(
  "keyup",
  e => {
    keys[e.code] = false;
  }
);


function updatePlayer() {

  if (!controls.isLocked)
    return;

  let speed =
    keys["ShiftLeft"]
      ? player.runSpeed
      : player.speed;


  if (keys["KeyW"])
    controls.moveForward(speed);

  if (keys["KeyS"])
    controls.moveForward(-speed);

  if (keys["KeyA"])
    controls.moveRight(-speed);

  if (keys["KeyD"])
    controls.moveRight(speed);


  // Don't fall below ground

  if (
    controls.object.position.y < 2
  ) {
    controls.object.position.y = 2;
  }
}


// ================================
// RAIN
// ================================

const rainCount = 2500;

const rainGeometry =
  new THREE.BufferGeometry();

const rainPositions = [];

for (
  let i = 0;
  i < rainCount;
  i++
) {

  rainPositions.push(
    (Math.random() - 0.5) * 500,
    Math.random() * 150,
    (Math.random() - 0.5) * 500
  );
}

rainGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    rainPositions,
    3
  )
);

const rainMaterial =
  new THREE.PointsMaterial({
    color: 0x8ac8ff,
    size: 0.12,
    transparent: true,
    opacity: 0.6
  });

const rain =
  new THREE.Points(
    rainGeometry,
    rainMaterial
  );

scene.add(rain);


function updateRain() {

  const positions =
    rain.geometry.attributes.position.array;

  for (
    let i = 1;
    i < positions.length;
    i += 3
  ) {

    positions[i] -= 1.4;

    if (positions[i] < 0) {
      positions[i] = 150;
    }
  }

  rain.geometry.attributes
    .position.needsUpdate = true;
}


// ================================
// RESIZE
// ================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


// ================================
// LOADING
// ================================

setTimeout(() => {

  document
    .getElementById("loading")
    .style.opacity = "0";

  setTimeout(() => {

    document
      .getElementById("loading")
      .remove();

  }, 1000);

}, 1200);


// ================================
// GAME LOOP
// ================================

function animate() {

  requestAnimationFrame(
    animate
  );

  updatePlayer();
  updateRain();

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>

</body>
</html>
